<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zensho Group – 20% Off Coupon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #B3122B;
    --red-deep: #7E0B1E;
    --ink: #1D1416;
    --paper: #FFFFFF;
    --muted: #6E5F62;
    --gold: #F2B632;
    --ok: #1E7A4C;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: "Bricolage Grotesque", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, var(--red) 0%, var(--red-deep) 100%) fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
  }

  .ticket {
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border-radius: 18px;
    position: relative;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    overflow: hidden;
  }
  .head { padding: 28px 28px 22px; text-align: center; }
  .brand { margin: 0; font-weight: 800; font-size: 1.5rem; letter-spacing: .01em; }
  .mission {
    margin: 10px auto 0; max-width: 26ch;
    font-size: .95rem; line-height: 1.45; color: var(--muted); font-style: italic;
  }

  .tear { position: relative; height: 0; border-top: 2px dashed #D9CFD1; margin: 0 18px; }
  .tear::before, .tear::after {
    content: ""; position: absolute; top: -14px;
    width: 26px; height: 26px; border-radius: 50%; background: var(--red-deep);
  }
  .tear::before { left: -31px; }
  .tear::after  { right: -31px; }

  .offer { padding: 26px 28px 8px; text-align: center; }
  .pct {
    font-weight: 800; font-size: clamp(5.5rem, 28vw, 7.5rem);
    line-height: .9; letter-spacing: -.04em; color: var(--red); margin: 0;
  }
  .pct small { font-size: .38em; letter-spacing: 0; margin-left: .08em; vertical-align: .55em; }
  .off {
    display: inline-block; margin-top: 6px; padding: 4px 18px;
    background: var(--gold); color: var(--ink);
    font-weight: 800; font-size: 1.15rem; border-radius: 999px;
  }
  .thanks { margin: 20px 0 0; font-size: 1.05rem; font-weight: 500; }

  .foot { padding: 22px 28px 26px; text-align: center; }
  .expiry { margin: 0; font-weight: 800; font-size: 1.2rem; }
  .live {
    margin: 10px 0 0; font-size: .8rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.8); } }

  .info { margin: 12px 0 0; font-size: .9rem; color: var(--muted); min-height: 1.2em; }
  .info.err { color: var(--red); font-weight: 600; }

  /* buttons */
  .btn {
    display: block; width: 100%; margin-top: 14px; padding: 14px 16px;
    font: inherit; font-weight: 600; font-size: 1.05rem;
    border: 0; border-radius: 12px; cursor: pointer; color: #fff; background: var(--ink);
  }
  .btn.red { background: var(--red); }
  .btn.ghost { background: transparent; color: var(--muted); font-weight: 500; margin-top: 6px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:focus-visible, .pin:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .pin {
    display: block; width: 100%; margin-top: 14px; padding: 12px;
    font: inherit; font-size: 1.2rem; text-align: center; letter-spacing: .3em;
    border: 2px solid #D9CFD1; border-radius: 12px;
  }
  [hidden] { display: none !important; }

  /* faded states: expired / used / invalid */
  .head, .offer, .expiry, .live { transition: opacity .5s, filter .5s; }
  .ticket.gray .head, .ticket.gray .offer, .ticket.gray .expiry, .ticket.gray .live {
    opacity: .3; filter: grayscale(1);
  }
  .ticket.gray .dot { background: #8B7F81; animation: none; }
  .ticket.loading .offer, .ticket.loading .head { opacity: .5; }

  .stamp {
    display: none; position: absolute; top: 46%; left: 50%;
    transform: translate(-50%, -50%) rotate(-12deg);
    padding: 6px 22px; border: 4px solid var(--red); color: var(--red);
    font-weight: 800; font-size: 2.2rem; border-radius: 10px;
    background: rgba(255,255,255,.88); white-space: nowrap;
  }
  .ticket.gray .stamp { display: block; }
  .stamp.dark { border-color: var(--ink); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } .ticket * { transition: none !important; } }
</style>
</head>
<body>
  <main class="ticket loading" id="ticket">
    <header class="head">
      <h1 class="brand">Zensho group</h1>
      <p class="mission">“Eradicate hunger and poverty from the world”</p>
    </header>

    <div class="tear" aria-hidden="true"></div>

    <section class="offer">
      <p class="pct">20<small>%</small></p>
      <span class="off">OFF</span>
      <p class="thanks">Thank you and enjoy 20% off</p>
    </section>

    <footer class="foot">
      <p class="expiry" id="expiry">Expired …</p>
      <p class="live"><span class="dot" aria-hidden="true"></span><span id="clock"></span></p>
      <p class="info" id="info" role="status"></p>

      <button type="button" class="btn" id="useBtn" hidden>ใช้แล้ว</button>

      <div id="confirmBox" hidden>
        <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN พนักงาน" hidden>
        <button type="button" class="btn red" id="confirmBtn">ยืนยันใช้คูปอง</button>
        <button type="button" class="btn ghost" id="cancelBtn">ยกเลิก</button>
      </div>
    </footer>

    <div class="stamp" id="stamp" aria-hidden="true"></div>
  </main>

<script>
(function () {
  // ====== SET THIS: the "Web app" URL from Google Apps Script (Deploy > New deployment) ======
  var API_URL = "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";
  // ============================================================================================

  var TZ = "Asia/Bangkok";
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var code = new URLSearchParams(location.search).get("c") || "";

  var $ = function (id) { return document.getElementById(id); };
  var ticket = $("ticket"), info = $("info"), stamp = $("stamp");
  var useBtn = $("useBtn"), confirmBox = $("confirmBox"), pinInput = $("pin");
  var pinRequired = false;

  function say(msg, isErr) { info.textContent = msg || ""; info.className = "info" + (isErr ? " err" : ""); }

  function setGray(text, dark) {
    ticket.classList.add("gray");
    stamp.textContent = text;
    stamp.className = "stamp" + (dark ? " dark" : "");
    useBtn.hidden = true; confirmBox.hidden = true;
  }

  function fmtDate(iso) {
    var p = iso.split("-");
    return +p[2] + " " + MONTHS[+p[1] - 1] + " " + p[0];
  }

  function render(s) {
    ticket.classList.remove("loading");
    if (!s || (!s.ok && s.error === "invalid")) {
      $("expiry").textContent = "Expired —";
      setGray("INVALID");
      say("คูปองไม่ถูกต้อง", true);
      return;
    }
    pinRequired = !!s.pinRequired;
    $("expiry").textContent = "Expired " + fmtDate(s.expires);

    if (s.expired) { setGray("EXPIRED"); say("คูปองหมดอายุแล้ว"); return; }

    if (s.uses >= s.max) {
      setGray("USED", true);
      say("ใช้แล้วเมื่อ " + (s.lastUsed || "-"));
      return;
    }

    ticket.classList.remove("gray");
    confirmBox.hidden = true;
    useBtn.hidden = false;
    useBtn.disabled = false;
    say(s.max > 1 ? "ใช้ไปแล้ว " + s.uses + "/" + s.max + " ครั้ง" : "");
  }

  function api(payload) {
    var opts = { cache: "no-store" };
    var url = API_URL;
    if (payload) {
      opts.method = "POST";
      opts.headers = { "Content-Type": "text/plain;charset=utf-8" }; // simple request, no CORS preflight
      opts.body = JSON.stringify(payload);
    } else {
      url += (API_URL.indexOf("?") > -1 ? "&" : "?") + "c=" + encodeURIComponent(code) + "&_=" + Date.now();
    }
    return fetch(url, opts).then(function (r) { return r.json(); });
  }

  function load() {
    if (API_URL.indexOf("PASTE_") === 0) {
      ticket.classList.remove("loading");
      say("ยังไม่ได้ตั้งค่า API_URL ในไฟล์ HTML", true);
      return;
    }
    if (!code) { render(null); return; }
    say("กำลังตรวจสอบคูปอง…");
    api().then(render).catch(function () {
      ticket.classList.remove("loading");
      say("เชื่อมต่อไม่ได้ กรุณารีเฟรชหน้านี้", true);
    });
  }

  useBtn.addEventListener("click", function () {
    useBtn.hidden = true;
    confirmBox.hidden = false;
    pinInput.hidden = !pinRequired;
    pinInput.value = "";
    say("แสดงหน้าจอนี้ให้พนักงานเป็นผู้กดยืนยัน");
    if (pinRequired) pinInput.focus();
  });

  $("cancelBtn").addEventListener("click", function () {
    confirmBox.hidden = true; useBtn.hidden = false; say("");
  });

  $("confirmBtn").addEventListener("click", function () {
    var btn = $("confirmBtn");
    btn.disabled = true;
    say("กำลังบันทึก…");
    api({ c: code, pin: pinInput.value }).then(function (s) {
      btn.disabled = false;
      if (s.error === "pin") { say("PIN ไม่ถูกต้อง", true); return; }
      render(s);
    }).catch(function () {
      btn.disabled = false;
      say("เชื่อมต่อไม่ได้ ยังไม่ได้บันทึก ลองใหม่อีกครั้ง", true);
    });
  });

  // live clock (Bangkok time): shows staff that this is a live page, not a screenshot
  function tick() {
    var p = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, day: "numeric", month: "numeric", year: "numeric",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    }).formatToParts(new Date());
    var o = {}; p.forEach(function (x) { o[x.type] = x.value; });
    $("clock").textContent = o.day + " " + MONTHS[+o.month - 1] + " " + o.year + "  " +
      o.hour.replace("24", "00") + ":" + o.minute + ":" + o.second;
  }
  tick(); setInterval(tick, 1000);

  load();
})();
</script>
</body>
</html>
